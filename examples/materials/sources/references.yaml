# =============================================================================
# Shared Reference Library
# =============================================================================
# All sources cited across route data files. Reference by source_ids on flows.
# ID convention: REF_<ORG/AUTHOR>_<YEAR>_<SHORT_TITLE>
# =============================================================================

sources:

  # ---------------------------------------------------------------------------
  # KEY DATABASES & TOOLS
  # ---------------------------------------------------------------------------
  - id: REF_GREET_2023
    type: database
    title: "GREET (Greenhouse gases, Regulated Emissions, and Energy use in Technologies) Model 2023"
    author: Argonne National Laboratory
    year: 2023
    url: https://greet.anl.gov
    accessed: null
    notes: "Primary LCA database for US battery supply chain; covers NMC, LFP, NCA. Key outputs: material intensities, energy, GHG per kWh."

  - id: REF_ECOINVENT_39
    type: database
    title: "ecoinvent database v3.9"
    author: ecoinvent Association
    year: 2023
    url: https://ecoinvent.org
    accessed: null
    notes: "Background LCI database; use for upstream processing stages where primary data is unavailable."

  - id: REF_PNNL_BatPaC
    type: dataset
    title: "BatPaC (Battery Performance and Cost) Model v5"
    author: "Argonne National Laboratory (Nelson, P. et al.)"
    year: 2022
    url: https://www.anl.gov/cse/batpac-model-software
    accessed: null
    notes: "Cell design and cost model; use to derive material masses from cell specs (electrode loading, density, N/P ratio)."

  # ---------------------------------------------------------------------------
  # IEA REPORTS
  # ---------------------------------------------------------------------------
