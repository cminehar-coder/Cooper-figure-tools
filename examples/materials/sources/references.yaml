  # ---------------------------------------------------------------------------
  # LITHIUM PROCESSING — SPODUMENE SPECIFIC
  # ---------------------------------------------------------------------------
  - id: REF_KELLY_2021_SPOD
    type: journal
    title: "Smarter use of lithium: perspectives on lithium supply, demand and future technologies"
    author: "Kelly, J.C. et al. (Argonne National Laboratory)"
    year: 2021
    doi: 10.1039/D0EE03536J
    notes: >
      Spodumene ore grades, concentrate specs, conversion factors (t concentrate per t LiOH·H2O),
      and processing yields for the hard-rock lithium supply chain. Referenced for Li processing
      loss breakdown and concentrate-to-LiOH conversion ratio of 6.0-7.0 t/t.
      Also covers brine vs hard-rock Li pathways comparison.
      NOTE: Verify exact doi; this citation represents the class of Argonne/DOE work on
      Li supply chain characterization available ca. 2021. If not accessible, substitute
      with GREET 2023 documentation or Pilbara Minerals DFS reports.

