        value: 0.12
        companies: [SungEel HiTech, POSCO HY Clean Metal]
        source_ids: [REF_HARPER_2019]
    discrepancy_flags:
      - type: mass_balance_gap
        description: >
          F102 represents unrecovered Fe + P + graphite + electrolyte (cell-level).
          With Policy 2 elemental-basis F101 (0.028 kg Li recovered as element), and
          Policy 9 explicit graphite-unrecovered framing, residue closure is:
            Fe (LFP): 0.751 kg/kWh × ~95% unrecovered = 0.713
            P (LFP): 0.417 kg/kWh × ~100% unrecovered = 0.417
            Graphite (anode): 1.272 kg/kWh × ~100% unrecovered (Policy 9) = 1.272
            Electrolyte (incinerated/destroyed): ~0.9 kg/kWh of which most is destroyed,
              tracked as ~0% mass-recovery → ~0 kg recovered, but only solid residue
              counted here.
            Li unrecovered (cell): 0.0933 × 0.70 = 0.065 kg Li (not recovered at central
              30% recovery rate — but this is in the residue, not the F102 line).
            Total solid residue ≈ 2.41 kg/kWh (Fe + P + graphite + Li residue).
          Mass closure at pack level: F100 (8.55) - F101 (0.028 Li) = 8.52 kg/kWh of
          residue, with ~6.1 kg/kWh in pack/module structural Al/Cu/steel/plastic that
          is not tracked in F102 since it does not return to the battery loop.
        sources_compared: [REF_HARPER_2019, REF_GREET_2023]
        magnitude_pct: 5.5
        status: resolved
        resolution_notes: >
          RESOLVED 2026-04-30 by Policy 2 (elemental basis) + Policy 9 (graphite
          explicit). Updated F102 = 2.41 kg/kWh including graphite explicitly at 0%
          recovery. Pack structural Al/Cu/steel/plastic (~6.1 kg/kWh) is not recycled
          into battery loop — tracked as out-of-scope mass via F100 - F101 - F102 = 6.11.
    notes: >
      DERIVATION (Policy 2 + Policy 9, 2026-04-30):
        Cell-level unrecovered solid mass:
          Fe in LFP CAM: 2.017 kg LFP × 55.85/157.76 = 0.714 kg Fe/kWh; ~95% unrecovered
            (Fe phosphate has low market value; some pilot FePO4-for-fertilizer pathways)
            → 0.679 kg Fe/kWh to F102.
          P in LFP CAM: 2.017 kg LFP × 30.97/157.76 = 0.396 kg P/kWh; ~100% unrecovered
            (no commercial P recovery from LFP) → 0.396 kg P/kWh to F102.
          Graphite anode: 1.272 kg/kWh; ~100% unrecovered (commercial recovery <1% in
            2024, Policy 9) → 1.272 kg/kWh to F102.
          Process Li in residue: 0.0933 × 0.70 = 0.065 kg Li (when Li recovery is 30%).
          Total ≈ 0.679 + 0.396 + 1.272 + 0.065 ≈ 2.41 kg/kWh.
        Range 2.05–3.00 reflects:
          - Low (2.05): Li recovery at high-end 85% reduces Li residue; Fe recovery improves
          - High (3.00): includes electrolyte char/SEI residue from pyrometallurgy
      Fe recovery from LFP: minimal commercial recovery (<5%); Fe phosphate has low market value.
      P recovery: essentially zero at commercial scale.
      Graphite recovery: commercial graphite recovery <1% in 2024 (Policy 9, accepted current
        state). EU Battery Regulation 2027 timeline may change this for 2030+ scenarios.
      LFP recycling streams are Fe-P-graphite dominated wastes with no economic recovery
        pathway at scale — a finding shared with NMC811 (graphite recovery) but more acute
        for LFP because Ni/Co salvage value is absent.
    verified: true
