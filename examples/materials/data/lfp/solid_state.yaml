# =============================================================================
# LFP — Solid-State Conventional Route
# =============================================================================
# Chemistry: LiFePO4
# Route: Solid-state synthesis from iron phosphate (FePO4) + Li2CO3
# Status: populated — all flows F001–F102 filled from literature + first-principles
# Last updated: 2026-04-30
# =============================================================================

meta:
  chemistry: LFP
  route: solid_state
  route_description: >
    Conventional solid-state LFP synthesis: FePO4 precursor + Li2CO3 blended and
    calcined at ~700°C under inert atmosphere. Results in micron-scale LFP particles
    (d50 ~2–5 µm) with moderate electrode compaction (~2.2–2.4 g/cc).
    Carbon coating applied via carbon source in calcination. Dominant route outside China.
  functional_unit: kWh
  year: 2023
  region: global
  status: populated

  target_specs:
    cell_format: prismatic
    nominal_voltage_V: 3.20
    cell_energy_density_Wh_L: 450
    cell_energy_density_Wh_kg: 180
    cathode_loading_mg_cm2: 18.0
    cathode_density_g_cc: 2.3        # Standard solid-state LFP compaction
    anode_loading_mg_cm2: 11.0
    n_p_ratio: 1.10
    electrolyte_amount_g_Ah: 2.8
    notes: >
      Specs representative of standard LFP prismatic cells (ca. 2022–2024).
      Lower energy density than NMC but longer cycle life and better safety.
      Source: BatPaC v5 (REF_PNNL_BatPaC).

  # Project-wide allocation convention for byproduct flows.
  allocation_convention:
    method: economic
    rationale: >
      Adopted 2026-04-30 as project default. Matches GREET 2023 and aligns with
      ISO 14044 / PEF guidance for handling multifunctional processes.
    flows_affected:
      - F010   # FeSO4 byproduct of TiO2 industry (sulfate-route plants)
      - F011   # Ferrous sulfate solution (downstream of F010)
    alternative_methods_in_uncertainty:
      low: mass_allocation
      high: unallocated_cutoff
    notes: >
      LFP iron source is dominantly TiO2-byproduct FeSO4 in commercial Chinese
      plants. Economic allocation gives a small Fe burden because TiO2 is the main
      product. F010/F011 values currently follow this convention; see flow notes
      for per-flow allocation arithmetic.

  calculation_notes: >
    All kg/kWh values derived from first-principles mass balance anchored to cell specs above.
    Cathode active material (LFP): loading 18.0 mg/cm², 92% active fraction →
    16.56 mg/cm² LFP; practical capacity 155 mAh/g at 3.20 V → 8.21 mWh/cm²;
    electrode area for 1 kWh = 121,800 cm²; LFP mass = 2.017 kg/kWh.
    Cross-checked against GREET 2023 (1.9–2.2 kg/kWh), Pell et al. 2021 (2.0 kg/kWh).
    FePO4 + ½Li2CO3 → LiFePO4 + ½CO2 (solid-state calcination stoichiometry).
    MW: LFP=157.76, FePO4=150.82, Li2CO3=73.89, H3PO4=97.99.


# =============================================================================
# NODES
# =============================================================================
nodes:
  - id: mining
    label: Mining
    description: >
      Extraction of raw materials: phosphate rock (P source), iron ore or iron-bearing
      waste streams (Fe source), spodumene or brine (Li), and flake graphite (anode).

  - id: beneficiation
    label: Beneficiation / Concentration
    description: >
      Physical upgrading: phosphate rock flotation/washing, iron ore concentration,
      graphite flotation. Less complex than NMC (no Ni, Co, Mn required).

  - id: chem_processing
    label: Chemical Processing
    description: >
      Conversion to battery-grade intermediates: phosphate rock → H3PO4;
      iron source → FeSO4 or Fe(OH)3; Li2CO3 from spodumene or brine.
      FePO4 precipitated from FeSO4 + H3PO4.

  - id: precursor_mfg
    label: Precursor Manufacturing
    description: >
      Production of iron phosphate (FePO4) precursor via wet-chemical precipitation
      or oxidation of ferrous phosphate. Alternative: direct use of iron oxalate.
      Precursor quality (particle size, morphology) determines final LFP properties.

  - id: cam_mfg
    label: CAM Manufacturing (LFP)
    description: >
      Solid-state calcination: FePO4 + Li2CO3 + carbon source → LiFePO4/C at ~650–750°C.
      Inert or reducing atmosphere. Carbon coating formed in situ. Milling to final PSD.

  - id: anode_mfg
    label: Anode Material Manufacturing
    description: >
      Spheronization and purification of natural graphite, or graphitization of
      petroleum coke. Same as NMC route.

  - id: electrode_mfg
    label: Electrode Manufacturing
    description: >
      LFP cathode slurry (LFP + conductive carbon + PVDF + NMP), coating on Al foil,
      drying, calendering to ~2.3 g/cc. NMC uses water-based slurry option less common for LFP.

  - id: cell_mfg
    label: Cell Manufacturing
    description: >
      Winding or stacking, electrolyte filling, sealing, formation cycling.
      LFP formation protocol differs from NMC (different SEI chemistry).

  - id: module_assembly
    label: Module Assembly
    description: Module integration with busbars, thermal management, and housing.

  - id: pack_mfg
    label: Pack Manufacturing
    description: Module-to-pack integration with BMS, cooling, and enclosure.

  - id: application
    label: Application
    description: >
      End-use: stationary energy storage, commercial EVs, e-buses, or LFP-based EV platforms.

  - id: eol_recycling
    label: End-of-Life / Recycling
    description: >
      LFP recycling is economically more challenging than NMC (lower Co/Ni value).
      Direct recycling or relithiation routes under development.
      Current commercial recovery primarily for Li; Fe and P largely unrecovered.

  - id: waste
    label: Process Waste / Losses
    description: Sink for all process losses and scrap.


# =============================================================================
# FLOWS
# =============================================================================
# All values in kg per kWh of nameplate LFP cell capacity.
# Calculation methodology documented in meta.calculation_notes above.
# =============================================================================

flows:

  # ---------------------------------------------------------------------------
  # PHOSPHORUS STREAM: Phosphate rock → H3PO4 → FePO4 precursor
  # ---------------------------------------------------------------------------
  - id: F001
    from: mining
    to: beneficiation
    material: phosphate rock
    material_id: PHOSPHATE_ROCK
    value: 3.97
    unit: kg_per_kWh
    uncertainty: {low: 3.2, high: 5.1, method: literature_range}
    yield_fraction: 0.80
    loss_destination: waste
    is_loss: false
    source_ids: [REF_GREET_2023, REF_IEA_2023_CMR, REF_USGS_2024_MINYB]
    region_breakdown:
      - region: CN
        share_pct: 40.0
        value: 1.59
        companies: [Yuntianhua, Hubei Xingfa, Wengfu Group, Guizhou Phosphate]
        source_ids: [REF_USGS_2024_MINYB, REF_IEA_2023_CMR]
        notes: >
          China dominates phosphate production volume (~40% of global mined output) but
          holds only ~5% of global reserves; Chinese rock supplies most domestic battery-grade H3PO4.
      - region: MA
        share_pct: 17.0
        value: 0.67
        companies: [OCP Group]
        source_ids: [REF_USGS_2024_MINYB]
        notes: >
          Morocco/W. Sahara holds ~70% of global phosphate reserves but ~17% of production.
          OCP Group is the dominant operator; little of this currently routes to battery-grade.
      - region: US
        share_pct: 9.0
        value: 0.36
        companies: [Mosaic, Nutrien]
        source_ids: [REF_USGS_2024_MINYB]
        notes: Florida/Idaho phosphate; primarily fertilizer-bound.
      - region: RU
        share_pct: 7.0
        value: 0.28
        companies: [PhosAgro, EuroChem]
        source_ids: [REF_USGS_2024_MINYB]
        notes: Khibiny apatite; igneous rock with low cadmium, high purity.
      - region: JO
        share_pct: 6.0
        value: 0.24
        companies: [Jordan Phosphate Mines Co]
        source_ids: [REF_USGS_2024_MINYB]
        notes: Eshidiya deposit.
      - region: ROW
        share_pct: 21.0
        value: 0.83
        companies: [ICL (IL), Foskor (ZA), OCP affiliates, others]
        source_ids: [REF_USGS_2024_MINYB]
        notes: Israel, Tunisia, Egypt, South Africa, Saudi Arabia, Brazil, Australia, etc.
    discrepancy_flags:
      - type: allocation_dependent
        description: >
          Only ~5–10% of phosphate rock production is purified to battery-grade H3PO4;
          the bulk goes to fertilizer (DAP/MAP/TSP). Mass-allocation between fertilizer
          and battery co-products dramatically changes burden assigned to LFP.
        sources_compared: [REF_GREET_2023, REF_IEA_2023_CMR]
        magnitude_pct: 80.0
        status: accepted_uncertainty
        resolution_notes: >
          Mass-allocation by P2O5 yield assumed; economic allocation would shift more burden
          to high-value battery-grade output but is not standard in GREET.
      - type: regional_share_uncertain
        description: >
          USGS 2024 vs IEA 2023 disagree on Morocco vs China share by ±3 pp;
          Western Sahara production sometimes attributed to Morocco.
        sources_compared: [REF_USGS_2024_MINYB, REF_IEA_2023_CMR]
        magnitude_pct: 5.0
        status: accepted_uncertainty
        resolution_notes: >
          ACCEPTED 2026-04-30 (Policy 11). 5 pp regional-share precision is within
          normal IEA/USGS data precision (±5–10%); flag retained as documented uncertainty.
    notes: >
      Derived from first principles: FePO4 needed = 2.029 kg/kWh; P in FePO4 = 20.53 wt%;
      P needed = 0.417 kg/kWh. Phosphate rock grade = 30% P2O5 → 13.1% P.
      Mining + beneficiation P recovery = 80%. Rock needed = 0.417 / (0.131 × 0.80) = 3.97 kg/kWh.
      Major producers: Morocco (~70%), China, US. P2O5 grade 28–36% BPL.
      Uncertainty range reflects ore grade variation (28–36% P2O5) and mining recovery (75–85%).
    verified: true

  - id: F002
    from: beneficiation
    to: chem_processing
    material: phosphoric acid (wet process)
    material_id: H3PO4
    value: 1.37
    unit: kg_per_kWh
    uncertainty: {low: 1.15, high: 1.65, method: literature_range}
    yield_fraction: 0.85
    loss_destination: waste
    is_loss: false
    source_ids: [REF_GREET_2023, REF_MAUGER_2019]
    region_breakdown:
      - region: CN
        share_pct: 90.0
        value: 1.23
        companies: [Yuntianhua, Hubei Xingfa, Wengfu Group, Chuandong Chemical, Chengxing Industrial]
        source_ids: [REF_IEA_2023_CMR, REF_MAUGER_2019]
        notes: >
          Battery-grade purified H3PO4 production for LFP feedstock is overwhelmingly Chinese;
          China holds the most concentrated solvent-extraction (SX) purification capacity.
      - region: ROW
        share_pct: 10.0
        value: 0.14
        companies: [ICL (IL/Spain), Prayon (BE), Innophos (US), OCP Group (MA, growing)]
        source_ids: [REF_IEA_2023_CMR]
        notes: >
          Non-China battery-grade H3PO4 is small but growing, including Moroccan OCP
          and US Innophos efforts to localize for IRA-compliant LFP supply.
    companies: [Yuntianhua, Hubei Xingfa, Wengfu Group, ICL, Prayon, OCP Group]
    discrepancy_flags:
      - type: regional_share_uncertain
        description: >
          The 90% China share for battery-grade H3PO4 is an industry rule of thumb;
          publicly disclosed plant-by-plant capacity data is sparse for this purified grade.
        sources_compared: [REF_IEA_2023_CMR, REF_MAUGER_2019]
        magnitude_pct: 5.0
        status: accepted_uncertainty
    notes: >
      Wet-process H3PO4 from phosphate rock via sulfuric acid digestion.
      H3PO4 MW = 97.99; P fraction = 31.6%. P needed per kWh = 0.417 kg.
      H3PO4 needed (theoretical) = 0.417 × (97.99/30.97) = 1.319 kg/kWh.
      Wet-process P recovery from rock ~85%; H3PO4 purification (SX or crystallisation)
      for battery grade adds ~10% loss. Total yield 85% → H3PO4 = 1.319 / 0.85 = 1.55 kg
      gross input; 1.37 kg delivered to chem_processing after purification losses.
      Wet-process H3PO4 requires SX purification to reach battery grade (<50 ppm impurities).
    verified: true

  # ---------------------------------------------------------------------------
  # IRON STREAM: Iron source → FeSO4 → FePO4
  # ---------------------------------------------------------------------------
  - id: F010
    from: mining
    to: beneficiation
    material: iron source (TiO2-byproduct FeSO4, economic allocation)
    material_id: null
    value: 0.20
    unit: kg_per_kWh
    uncertainty: {low: 0.05, high: 2.50, method: allocation_range}
    yield_fraction: 0.85
    loss_destination: waste
    is_loss: false
    source_ids: [REF_GREET_2023, REF_IEA_2023_CMR, REF_PELL_2021, REF_MAUGER_2019]
    region_breakdown:
      - region: CN
        share_pct: 85.0
        value: 0.17
        companies: [Lomon Billions, CNNC Hua Yuan Titanium, Pangang Group]
        source_ids: [REF_IEA_2023_CMR, REF_MAUGER_2019]
        notes: >
          China dominates LFP-grade FeSO4 supply, primarily as TiO2 sulfate-process
          byproduct (Lomon Billions is the largest TiO2 producer globally). Region
          share raised to 85% (from 80%) to reflect ~80–90% of Chinese FePO4 plants
          using domestic TiO2-byproduct FeSO4.
      - region: ROW
        share_pct: 15.0
        value: 0.03
        companies: [Tronox (US/AU), Kronos (US/EU), Venator (UK), Rio Tinto (steel pickling FeSO4)]
        source_ids: [REF_IEA_2023_CMR]
        notes: >
          Non-China FeSO4 mostly from non-Chinese TiO2 producers and steel pickle liquor;
          much of it is not purified to battery grade.
    companies: [Lomon Billions, CNNC Hua Yuan Titanium, Tronox, Kronos]
    discrepancy_flags:
      - type: source_contradiction
        description: >
          F010 mass value depends on whether iron source is virgin iron ore (~1.47 kg/kWh
          unallocated), FeSO4·7H2O byproduct (~3.74 kg/kWh as heptahydrate), or steel
          scrap (negligible). GREET treats as iron ore; industry reality is dominantly
          TiO2 byproduct in China.
        sources_compared: [REF_GREET_2023, REF_MAUGER_2019, REF_PELL_2021]
        magnitude_pct: 150.0
        status: resolved
        resolution_notes: >
          RESOLVED 2026-04-30 by Policy 6 (project-wide convention). Adopted TiO2-byproduct
          FeSO4 with ECONOMIC ALLOCATION as central convention because this is the dominant
          commercial Fe source for LFP (~80–90% of Chinese FePO4 plants). Under economic
          allocation TiO2 is the main product (>90% of Cu-Co-Fe revenue split equivalent
          for Ti-Fe sulfate route), so Fe burden allocated to LFP is small (~10–15% of
          unallocated burden). Central F010 = 0.20 kg/kWh (~0.751 kg Fe/kWh × 0.135
          allocation factor / 0.50 effective grade × 0.85 recovery, simplified for
          Sankey display). Uncertainty.high (2.50 kg/kWh) preserves the all-virgin-iron-ore
          unallocated upper bound; uncertainty.low (0.05 kg/kWh) corresponds to free
          byproduct (cut-off allocation). Convention documented in meta.allocation_convention.
      - type: unaccounted_material
        description: >
          When FeSO4 is sourced as TiO2 byproduct, upstream burden of TiO2 process is not
          allocated here. Co-product allocation between TiO2 and FeSO4 not specified.
        magnitude_pct: 100.0
        status: accepted_uncertainty
        resolution_notes: >
          ACCEPTED 2026-04-30 — economic allocation now applied per Policy 6.
    notes: >
      Fe source: ~80–90% TiO2-byproduct FeSO4 (Chinese sulfate-route plants); remainder
      virgin iron ore or steel pickle liquor. Project convention (Policy 6, 2026-04-30)
      adopts TiO2-byproduct with ECONOMIC ALLOCATION as central case.

      ALLOCATION ARITHMETIC:
        Fe needed per kWh: FePO4 = 2.029 kg; Fe fraction = 37.03%; Fe = 0.751 kg/kWh.
        Virgin-iron-ore basis (unallocated): ore/kWh = 0.751 / (0.60 × 0.85) = 1.47 kg/kWh.
        FeSO4·7H2O byproduct basis (cut-off): MW = 278.01, Fe = 20.09%; FeSO4·7H2O/kWh
          = 0.751/0.2009 = 3.74 kg/kWh, but burden allocated to TiO2 (cut-off → 0).
        ECONOMIC ALLOCATION (central): 2022–2023 prices for TiO2 (~$3,500/t) vs FeSO4
          (~$50/t); Fe burden share ≈ 0.05–0.15 × virgin-ore burden.
        Reported central F010 = 0.20 kg/kWh (~14% of virgin ore equivalent), reflecting
          TiO2-co-product economic allocation as project convention.

      ALTERNATIVE METHODS (in uncertainty bounds):
        - Cut-off (FeSO4 free byproduct): ~0.05 kg/kWh
        - Mass allocation: ~0.30 kg/kWh
        - Unallocated virgin iron ore: ~1.47 kg/kWh
        - Unallocated FeSO4·7H2O: ~3.74 kg/kWh (uncertainty.high range)

      Region_breakdown values updated to reflect 0.20 kg/kWh central allocated total.
    verified: true

  - id: F011
    from: beneficiation
    to: chem_processing
    material: ferrous sulfate solution
    material_id: null
    value: 2.04
    unit: kg_per_kWh
    uncertainty: {low: 1.70, high: 2.50, method: literature_range}
    yield_fraction: 0.92
    loss_destination: waste
    is_loss: false
    source_ids: [REF_GREET_2023, REF_MAUGER_2019]
    region_breakdown:
      - region: CN
        share_pct: 80.0
        value: 1.63
        companies: [Lomon Billions, CNNC Hua Yuan Titanium, Pangang Group]
        source_ids: [REF_MAUGER_2019, REF_IEA_2023_CMR]
        notes: TiO2-byproduct FeSO4 production concentrated in Sichuan/Henan/Anhui.
      - region: ROW
        share_pct: 20.0
        value: 0.41
        companies: [Tronox, Kronos, Venator]
        source_ids: [REF_MAUGER_2019]
        notes: Largely not purified to LFP grade; minor flow.
    companies: [Lomon Billions, CNNC Hua Yuan Titanium, Tronox, Kronos]
    discrepancy_flags:
      - type: source_contradiction
        description: >
          FeSO4 source (TiO2 byproduct vs steel pickle vs virgin synthesis) varies by source;
          mass flow on anhydrous basis here, but real shipments arrive as heptahydrate.
        sources_compared: [REF_GREET_2023, REF_MAUGER_2019]
        magnitude_pct: 80.0
        status: accepted_uncertainty
        resolution_notes: >
          ACCEPTED 2026-04-30 (Policy 6). F011 mass intensity (anhydrous FeSO4 needed
          for FePO4 precipitation, 2.04 kg/kWh) is dictated by stoichiometry and is
          robust to source-of-Fe choice. The allocation/source-of-Fe question is
          handled at F010 (upstream mining/byproduct gate). F011 is the chemistry-
          dictated reactant flow regardless of how the Fe burden is allocated upstream.
    notes: >
      FeSO4 (anhydrous) MW = 151.91; Fe fraction = 36.74%.
      FeSO4 needed = 0.751 / 0.3674 = 2.044 kg/kWh (anhydrous basis).
      In practice FeSO4 arrives as heptahydrate (FeSO4·7H2O = 3.74 kg/kWh) or dissolved solution.
      Value here is anhydrous equivalent for mass balance clarity.
      FeSO4 oxidised to Fe3+ (FePO4 precipitation requires Fe3+ or in-situ oxidation with H2O2/air).
      Yield 92% accounts for Fe losses during oxidation and precipitation steps.
    verified: true

  - id: F012
    from: chem_processing
    to: precursor_mfg
    material: iron phosphate (battery-grade FePO4)
    material_id: FE_PHOSPHATE
    value: 2.05
    unit: kg_per_kWh
    uncertainty: {low: 1.80, high: 2.35, method: literature_range}
    yield_fraction: 0.95
    loss_destination: waste
    is_loss: false
    source_ids: [REF_GREET_2023, REF_MAUGER_2019, REF_PELL_2021]
    region_breakdown:
      - region: CN
        share_pct: 95.0
        value: 1.95
        companies: [Hunan Yuneng New Energy Battery Material, Shenzhen Dynanonic, Hubei Wanrun, Hubei Xingfa, Lomon Billions]
        source_ids: [REF_IEA_2023_CMR, REF_MAUGER_2019]
        notes: >
          FePO4 production is the most geographically concentrated step in the LFP supply chain;
          virtually all commercial battery-grade FePO4 is produced in China, often co-located
          with H3PO4 / FeSO4 sources (Hubei, Sichuan, Yunnan, Guizhou).
      - region: ROW
        share_pct: 5.0
        value: 0.10
        companies: [ICL (IL/Spain pilot), Aleees (TW), Prayon (BE), First Phosphate (CA, pilot)]
        source_ids: [REF_IEA_2023_CMR]
        notes: >
          Limited non-China FePO4: Aleees (Taiwan) historical; ICL with Dalradian pilot;
          First Phosphate developing IRA-compliant supply in Canada/US.
    companies: [Hunan Yuneng, Shenzhen Dynanonic, Hubei Wanrun, Lomon Billions, Aleees, ICL]
    discrepancy_flags:
      - type: regional_share_uncertain
        description: >
          China share for FePO4 is widely cited as >95%, but no single source disputes this;
          flag retained as open because publicly disclosed plant-level capacity is sparse.
        magnitude_pct: 3.0
        status: accepted_uncertainty
    notes: >
      FePO4 MW = 150.82; synthesised by co-precipitation of FeSO4 + H3PO4 + oxidant
      (e.g. H2O2 or O2): FeSO4 + H3PO4 + ½H2O2 → FePO4↓ + H2SO4 + H2O.
      Theoretical FePO4 per kg LFP = 150.82/157.76 = 0.9560 kg/kg.
      FePO4 to electrode per kWh = 0.9560 × 2.017 = 1.929 kg (at calcination input).
      With 95% precipitation yield: FePO4 produced at chem_processing = 1.929/0.95 × 1.0 ≈ 2.030 kg.
      Adding ~1% for FePO4·2H2O→FePO4 dehydration loss: effective delivery = 2.05 kg/kWh.
      FePO4·2H2O dehydrated at ~300°C before solid-state blending. Particle morphology
      (plate-like preferred) is critical for LFP electrochemical performance.
    verified: true

  # ---------------------------------------------------------------------------
  # LITHIUM STREAM: Spodumene or brine → Li2CO3
  # ---------------------------------------------------------------------------
  - id: F020
    from: mining
    to: beneficiation
    material: spodumene ore (or lithium brine)
    material_id: LI_SPOD_ORE
    value: 16.70
    unit: kg_per_kWh
    uncertainty: {low: 12.5, high: 22.0, method: literature_range}
    yield_fraction: 0.80
    loss_destination: waste
    is_loss: false
    source_ids: [REF_GREET_2023, REF_IEA_2023_CMR, REF_USGS_2024_MINYB]
    region_breakdown:
      - region: AU
        share_pct: 47.0
        value: 7.85
        companies: [Pilbara Minerals, Mineral Resources, Albemarle (Greenbushes JV), IGO/Tianqi (Greenbushes JV), Liontown]
        source_ids: [REF_USGS_2024_MINYB, REF_IEA_2023_CMR]
        notes: Hard-rock spodumene; Greenbushes is the largest single Li mine globally.
      - region: CL
        share_pct: 30.0
        value: 5.01
        companies: [SQM, Albemarle]
        source_ids: [REF_USGS_2024_MINYB]
        notes: Salar de Atacama brine.
      - region: CN
        share_pct: 15.0
        value: 2.51
        companies: [Tianqi, Ganfeng, Zangge Mining, Sichuan Yahua]
        source_ids: [REF_USGS_2024_MINYB, REF_IEA_2023_CMR]
        notes: >
          Domestic Chinese Li from Qinghai/Tibet brines and Sichuan/Jiangxi spodumene/lepidolite.
          Lepidolite is increasingly used for LFP-grade Li2CO3 due to lower purity tolerance.
      - region: AR
        share_pct: 5.0
        value: 0.84
        companies: [Livent (now Arcadium), Allkem (now Arcadium), Ganfeng (Cauchari-Olaroz)]
        source_ids: [REF_USGS_2024_MINYB]
        notes: Salar del Hombre Muerto, Olaroz, Cauchari brines.
      - region: ROW
        share_pct: 3.0
        value: 0.50
        companies: [Sigma Lithium (BR), AMG (BR), Zimbabwe spodumene operations (Sinomine, Zhejiang Huayou)]
        source_ids: [REF_USGS_2024_MINYB]
        notes: Brazil, Zimbabwe, Portugal, Canada (small but growing).
    discrepancy_flags:
      - type: regional_share_uncertain
        description: >
          USGS and IEA differ on Australia vs Chile share by ±5 pp depending on year;
          fast-growing Zimbabwe/Brazil shares may be under-reported.
        sources_compared: [REF_USGS_2024_MINYB, REF_IEA_2023_CMR]
        magnitude_pct: 10.0
        status: accepted_uncertainty
        resolution_notes: >
          ACCEPTED 2026-04-30 (Policy 11). ±5 pp regional-share precision is within
          normal IEA/USGS data precision (±5–10%); flag retained as documented uncertainty.
    notes: >
      Spodumene pathway (hard-rock): ore grade ~1.5% Li2O → Li fraction = 1.5% × (2×6.94/29.88) = 0.697%.
      Li2CO3 per kWh = 0.497 kg; Li in Li2CO3 = 18.78%; Li needed = 0.0933 kg/kWh.
      Ore needed = 0.0933 / (0.00697 × 0.80) = 16.7 kg ore/kWh (80% mining recovery).
      Uncertainty low: brine pathway (Atacama) or high-grade ore; high: low-grade deposits.
      Note: LFP uses Li2CO3 (not LiOH·H2O as in NMC811), reducing processing complexity.
