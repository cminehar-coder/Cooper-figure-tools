    region_breakdown:
      - region: CN
        share_pct: 75.0
        value: 6.41
        companies: [BYD/CATL fleet, GEM, Brunp]
        source_ids: [REF_IEA_2023_CMR]
        notes: >
          China is both largest user and recycler of LFP; collected packs largely stay in-country
          due to hazmat shipping constraints.
      - region: ROW
        share_pct: 25.0
        value: 2.14
        companies: [Tesla fleet (US/EU), VW/Stellantis fleets, Fluence/Tesla ESS]
        source_ids: [REF_IEA_2023_CMR]
        notes: Outside-China LFP collection growing as fleet ages; second-life often delays recycling 5–10 years.
    companies: [BYD, CATL, Tesla, GEM, Brunp]
    notes: >
      Mass flow into EoL equals pack mass (F090 = 8.55 kg/kWh); some degradation in capacity
      during use, but physical mass is conserved. LFP packs commonly used for 2nd-life
      stationary storage (8–10 additional years) before recycling, reducing effective recycling rate.
      Collection rate assumed 80–90% in advanced markets (EU, China policy-driven).
      LFP EoL economics are challenging: no high-value Ni/Co to recover; Li recovery
      from LFP requires more aggressive processing (pyrometallurgy leaves Li in slag).
    verified: true

