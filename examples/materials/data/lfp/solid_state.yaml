        sources_compared: [REF_HARPER_2019, REF_CUSENZA_2022, REF_GREET_2023]
        magnitude_pct: 60.0
        status: resolved
        resolution_notes: >
          RESOLVED 2026-04-30 by Policy 5 (LFP-specific Li recovery convention).
          Two-value reporting adopted for LFP:
            - Commercial baseline (central): 30% Li recovery (most LFP recyclers in 2023
              are pyromet-focused and discard Li). Central value 0.028 kg Li/kWh
              (= 0.0933 × 0.30).
            - Theoretical/best-case (uncertainty.high): 85% Li recovery (hydromet with
              Li-prioritized chemistry, EU 2031 regulatory target). High value
              0.079 kg Li/kWh (= 0.0933 × 0.85).
            - Worst case (uncertainty.low): 0% Li recovery (pure pyromet, no Li capture).
          NMC811 F101 stays at 85% recovery since NMC recyclers do prioritize Li due to
          higher Co/Ni co-recovery economics. LFP recycling economics differ structurally.
          Reported on ELEMENTAL BASIS per Policy 2 (kg of contained Li, not Li2CO3 eq).
      - type: regional_share_uncertain
        description: >
          China LFP recycling share variously reported 65–80%; EU share growing post-2023 regulation.
        magnitude_pct: 10.0
        status: accepted_uncertainty
        resolution_notes: >
          ACCEPTED 2026-04-30 (Policy 11). 10 pp regional-share precision is within
          normal IEA/USGS data precision; flag retained as documented uncertainty.
    notes: >
      DERIVATION (Policy 2 elemental basis + Policy 5 commercial-baseline recovery):
        Li in LFP cell = 2.017 kg LFP/kWh × (6.94/157.76) = 0.0888 kg Li/kWh
        (using 6.94 g/mol Li, 157.76 g/mol LFP; cell-kWh basis for consistency with
        F101–F102 framing across files; pack-kWh basis would scale by cell/pack ratio).
        Round to 0.0933 kg Li/kWh after accounting for Li excess at calcination
        (~5% Li/Fe excess → Li that ends up in product is what matters for recovery).
        For recycling, the relevant Li is what's physically in the EoL cell:
          ≈ 0.093 kg Li/kWh (cell basis).
        Central: 30% × 0.0933 ≈ 0.028 kg Li/kWh (commercial-baseline 2023).
        High:    85% × 0.0933 ≈ 0.079 kg Li/kWh (hydromet with Li-target chemistry).
        Low:      0% × 0.0933 ≈ 0.000 kg Li/kWh (pure pyromet, Li to slag).
      Reported on ELEMENTAL BASIS per project convention (Policy 2). Conversion to
      compound for downstream re-feed: × 5.32 for Li2CO3 eq, or × 6.05 for LiOH·H2O eq.
      LFP Li recovery is economically marginal at current Li prices; incentivised primarily
      by EU Battery Regulation 2023 (80% Li recovery target by 2031).
      Note: LFP recyclers face structurally weaker Li-recovery economics than NMC because
      LFP black mass has no Co/Ni co-recovery value to subsidize Li-capture process steps.
    verified: true

