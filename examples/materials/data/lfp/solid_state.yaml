        source_ids: [REF_IEA_2023_CMR]
        notes: US (Silver Peak), Australia (Kwinana), small.
    discrepancy_flags:
      - type: regional_share_uncertain
        description: >
          China share for Li2CO3 refining is ~70–80% across sources; LFP-specific share
          may be even higher because most non-China refineries target LiOH for NMC.
        sources_compared: [REF_IEA_2023_CMR, REF_USGS_2024_MINYB]
        magnitude_pct: 10.0
        status: accepted_uncertainty
    notes: >
      Stoichiometry: LiFePO4 = LiPO4 × Fe, MW 157.76; Li MW = 6.94; Li2CO3 MW = 73.89.
      Li2CO3 per mol LFP = ½ mol → 73.89/2 = 36.945 g per 157.76 g LFP.
      Li2CO3 per kg LFP (theoretical) = 36.945/157.76 = 0.2342 kg/kg.
      LFP produced per kWh = 2.017 kg (from cell design calc; see meta.calculation_notes).
      Theoretical Li2CO3 = 0.2342 × 2.017 = 0.472 kg/kWh.
      Li excess used in practice ~5% (Li/Fe = 1.05 to compensate volatilisation): × 1.05 = 0.496 kg.
      With 92% chemical conversion yield (brine/spodumene → battery-grade Li2CO3): 0.496/0.92 = 0.539.
      Rounded to 0.50 kg/kWh at point of delivery to precursor_mfg (after any purification losses).
      GREET 2023 reports 0.44–0.55 kg Li2CO3/kWh for LFP cells; Pell et al. 2021: ~0.48 kg/kWh.
      Li2CO3 preferred over LiOH for solid-state LFP (lower cost, suitable calcination temp).
    verified: true

