    is_loss: false
    source_ids: [REF_MAUGER_2019, REF_GREET_2023]
    notes: >
      ADDED 2026-04-30 (Policy 7) for cross-route comparison with hydrothermal LFP.
      Solid-state LFP synthesis (FePO4 + Li2CO3 calcination at 700–750°C) uses
      relatively little process water — primarily for slurry mixing, washing of
      milled CAM, and ancillary cleaning operations. Mauger 2019 reports 3–8 L/kg
      LFP water consumption for solid-state route; at 2.02 kg LFP/kWh this is
      ~6–16 L/kWh. Central 10 L/kWh is mid-range.
      Hydrothermal route (lfp/hydrothermal_nano.yaml F035) uses 3–5× more water
      (35–50 L/kWh) because the reaction medium is aqueous.
