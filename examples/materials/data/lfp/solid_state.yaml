      Solid-state LFP synthesis (calcination at 700–750°C in inert atmosphere, plus
      milling, drying, and ancillary plant utilities) typically consumes 10–25 MJ/kg LFP
      electricity-equivalent (Mauger 2019). At 2.02 kg LFP/kWh this is ~20–50 MJ/kWh.
      Central 30 MJ/kWh assumes ~15 MJ/kg LFP for the calcination step itself plus
      plant overhead (compressed air, HVAC, slurry mixing if water-based, milling).
      Hydrothermal route (lfp/hydrothermal_nano.yaml F036) uses ~2–3× more electricity
      (60–100 MJ/kWh) due to the autoclave heating and post-synthesis carbon-coating
      anneal.
      Note: This flow tracks PROCESS ELECTRICITY only; embodied/upstream energy in
      reagents and ores is captured through their own mass flows.
    verified: false

