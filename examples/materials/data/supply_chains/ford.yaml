# =============================================================================
# Ford Mustang Mach-E Battery Supply Chain — Bilateral Relationship Dataset
# =============================================================================
# Companion to data/supply_chains/tesla.yaml. Same schema, same confidence
# ladder. Scope is intentionally narrow: TWO Mach-E trims for 2023-2024:
#
#   FORD_MACHE_SR  — Standard Range, LFP pack, CATL cells (Cuautitlan MX build)
#   FORD_MACHE_ER  — Extended Range, NMC pack, LGES cells (Cuautitlan MX build)
#
# Why Ford: IRA Section 30D eligible-vehicle list and Ford's own Integrated
# Sustainability Report force unusually strong public attribution for cell and
# major raw-material partners. CATL-Ford LFP licensing arrangement (BlueOval
# Battery Park Michigan, planned post-2026) is a separate forward-looking
# announcement and is OUT OF SCOPE for the 2023-2024 period covered here.
#
# IMPORTANT: Tier-2 / Tier-3 entries that are also held by Tesla via the same
# upstream cell maker (CATL Changshu, LGES Holland MI / Wroclaw / Nanjing,
# POSCO Future M, etc.) are NOT duplicated here. They are referenced via
# `shared_with_tesla_rel:` pointing back to tesla.yaml's REL_xxx ID. Only
# Ford-specific named relationships (e.g. POSCO-Pilbara JV LiOH bound for
# LGES NMC for Mach-E ER) are given their own REL_ ID in this file's
# FORD_REL_ namespace.
# =============================================================================

meta:
  scope: Ford Mustang Mach-E battery supply chain (cell, cathode, raw material, mine attribution)
  vehicle_program: Mustang Mach-E (2021-2025 generations; this file 2023-2024 model years)
  period: "2023-2024"
  status: in_progress  # First cut; expect revision when 2025 IRA 30D list and Ford Integrated Sustainability Report 2024 land
  data_sources_policy: |
    PUBLIC SOURCES ONLY. Ford Integrated Sustainability Report, Ford 10-K,
    IRA Section 30D Eligible Vehicles list (fueleconomy.gov), Ford press
    releases, BlueOval SK / BlueOval Battery Park MI announcements, OEM
    sustainability reports for upstream suppliers (CATL ESG, LGES SR, POSCO
    Future M SR), peer-reviewed and industry news with named sources
    (Reuters, Bloomberg free side, Automotive News, Electrek). NO Benchmark
    Mineral Intelligence, BNEF, Wood Mackenzie, S&P Global Mobility, Adamas,
    or any paywalled trade-data product. If a relationship is only verifiable
    through those, it is filed under `gaps:` rather than `supply_relationships:`.

  confidence_levels: |
    Same ladder as data/supply_chains/tesla.yaml. Repeated here for clarity:

    confirmed_public_disclosure
        Named in Ford 10-K / Sustainability Report, IRA 30D eligibility list,
        the supplier's own SR/AR/IR, an SEC filing, or a contemporaneous
        joint press release. Either the relationship or a multi-year offtake
        is explicitly stated.

    industry_reporting
        Named in Reuters / Automotive News / Electrek / Bloomberg (free
        side) / Nikkei with a NAMED human source (analyst, executive, or
        document leak). Single-source unattributed press articles are
        treated as inferred, not industry.

    inferred
        Process-of-elimination from public facts (e.g., LGES Holland MI was
        Mach-E ER's named cell source pre-2024; Wroclaw historically
        supplied Mach-E EU exports; therefore EU-bound 2023 Mach-E ER cells
        likely originated at Wroclaw). Reasoning documented in `notes:`.

    unknown
        Gap. Documented in `gaps:` with what would resolve.

  field_definitions: |
    products[].id                    - Stable ID (FORD_<MODEL>_<TRIM>)
    products[].pack_chemistry        - LFP | NMC | NCA | NCMA | mixed
    products[].route_file            - Path to per-kWh route flow file the
                                        renderer pairs with this product
    products[].pack_kWh              - Nameplate / usable pack capacity
                                        (verified against Ford spec sheet)
    products[].cell_makers[].share_pct_estimate
                                     - "estimate" suffix where Ford did not
                                        disclose volume splits.

    supply_relationships[].downstream / .upstream
                                     - Pair forming a single directed edge
    supply_relationships[].material  - Material flowing on this edge
    supply_relationships[].source_ids
                                     - References to sources/references.yaml
    supply_relationships[].shared_with_tesla_rel
                                     - When the upstream relationship is
                                       identical to a Tesla-file edge, points
                                       to its REL_xxx for evidence rather than
                                       duplicating data. Ford-bilateral entries
                                       with Ford-specific evidence get their
                                       own FORD_REL_ ID.
    supply_relationships[].quantity_estimate
                                     - Tonnage where public sources disclose
                                       (e.g. POSCO-Pilbara JV 43kt/yr LiOH).

  cross_check_to_route_files: |
    Each product points to its per-kWh route file:
      FORD_MACHE_SR -> data/lfp/solid_state.yaml
      FORD_MACHE_ER -> data/nmc811/conventional.yaml
    Companies named here SHOULD also appear in those files'
    region_breakdown.companies lists (CATL Changshu, LGES Holland MI / Wroclaw,
    POSCO Future M Gwangyang, Hunan Yuneng, BTR, Vale Sudbury, BHP Nickel West,
    Tianqi Kwinana, Glencore KCC, etc.). Any mismatch is a flag for review.

  ira_section_30d_note: |
    For the 2024 model year, IRA 30D credit eligibility is the cleanest public
    disclosure event. Mach-E SR and ER credit statuses are tracked at
    fueleconomy.gov; 2024 Mach-E lost full $7,500 credit due to FEOC content
    rules tightening (CATL LFP cells are FEOC-affiliated). Ford's response,
    starting late 2024 / 2025: domestic CATL-licensed LFP at Marshall MI
    (BlueOval Battery Park; OUT OF SCOPE here, future scope file).


# =============================================================================
# PRODUCTS — Ford battery-using SKUs in scope (Mach-E only; F-150 Lightning,
# E-Transit, etc. are out of scope for this file)
# =============================================================================
# kWh values: nominal pack capacity per Ford spec sheet (ford.com Mach-E pages,
# 2024 model-year). SR LFP nominal 70 kWh / usable ~72; ER nominal 91 kWh /
# usable ~88-91 depending on AWD/RWD trim and model year.

products:

  # ---------------------------------------------------------------------------
  # MUSTANG MACH-E STANDARD RANGE (LFP, post-late-2023 chemistry shift)
  # ---------------------------------------------------------------------------
  - id: FORD_MACHE_SR
    company: Ford
    product: Mustang Mach-E Standard Range (RWD)
    region_built: MX  # Cuautitlán, Mexico (final assembly)
    period: "2023-2024"
    pack_chemistry: LFP
    route_file: data/lfp/solid_state.yaml
    pack_kWh: 70                    # Nominal; SR was 68 kWh NMC pre-2023; LFP shift announced May-2023, ramped Q4-2023
    pack_kWh_usable: 72
    cell_format: prismatic
    cell_makers:
      - {company: CATL, facility: Changshu (Jiangsu, CN), share_pct_estimate: 100, confidence: confirmed_public_disclosure, region: CN}
    notes: |
      Ford announced Mach-E LFP shift in May-2023 (Ford press release; Reuters
      coverage). 2024-MY Mach-E SR and select 2023-MY late-build SR units
      shipped with CATL LFP prismatic cells imported from Changshu (China).
      This is the same Changshu LFP line that supplies CATL's prismatic LFP
      to multiple OEMs; Ford-bound volumes ship as packs / modules to
      Cuautitlán for final pack assembly + vehicle build.

      Pack kWh: Ford's own US spec sheet for 2024-MY Mach-E SR RWD shows
      72 kWh usable (~70 kWh nominal). Pre-2023 SR was 68 kWh NMC.

      IRA 30D status (2024): Mach-E SR LOST eligibility for the $7,500
      credit beginning Jan-2024 because CATL is FEOC-affiliated. This is
      a confirmation of the CATL relationship (only reason for credit loss).

  # ---------------------------------------------------------------------------
  # MUSTANG MACH-E EXTENDED RANGE (NMC; RWD and AWD trims)
  # ---------------------------------------------------------------------------
  - id: FORD_MACHE_ER
    company: Ford
    product: Mustang Mach-E Extended Range (RWD / AWD; incl. GT)
    region_built: MX  # Cuautitlán, Mexico
    period: "2023-2024"
    pack_chemistry: NMC                   # NMC622 / NMC811 mixed, polycrystalline
    route_file: data/nmc811/conventional.yaml
    pack_kWh: 91                          # Nominal; usable ~88 kWh per Ford spec sheet
    pack_kWh_usable: 88
    cell_format: pouch                    # LGES large-pouch NMC (Mach-E pack arch)
    cell_makers:
      - {company: LG Energy Solution, facility: Holland MI (US), share_pct_estimate: 75, confidence: confirmed_public_disclosure, region: US, notes: "Primary Mach-E ER cell plant for NA-built packs through 2024 per Ford 2023 Integrated Sustainability Report and Reuters reporting."}
      - {company: LG Energy Solution, facility: Wroclaw (PL), share_pct_estimate: 25, confidence: estimated_per_facts, region: PL, notes: "Partial backstop for MX-bound builds and EU-market Mach-E ER. Lower share inferred from Ford disclosures designating Holland MI as primary."}
    notes: |
      Ford 2023 Integrated Sustainability Report names LGES as the cell
      supplier for Mach-E (NMC pouch). LGES Holland (Michigan) is the
      historical primary plant for Mach-E ER through 2023; LGES Wroclaw
      (Poland) supplied earlier Mach-E ER builds and continues partial
      backstop for Mexico-bound packs alongside Holland.

      Pack architecture: the Mach-E ER pack uses LGES large-format pouch
      cells (the same family used by other Ford EVs prior to BlueOval SK
      Tennessee online date). Cuautitlán performs final pack assembly for
      both SR and ER trims, with cells / modules shipped in.

      IRA 30D status (2024): Mach-E ER retained PARTIAL credit ($3,750)
      under 2024 critical minerals + battery components rules; Ford 2024
      IRA filing is the public attestation. Loss of half the credit reflects
      partial FEOC-affiliated upstream content (e.g. some Chinese refining
      steps in LGES Ni / Co supply chain).

      NOTE: SK On / BlueOval SK Commerce GA plant is for F-150 Lightning,
      NOT Mach-E. Do not confuse. (Out of scope here.)


# =============================================================================
# SUPPLY RELATIONSHIPS — Bilateral edges
# =============================================================================
# IDs use FORD_REL_ namespace to keep separate from tesla.yaml's REL_xxx.
# Tier-2 / Tier-3 edges that are identical to tesla.yaml entries (same
# upstream cell maker -> same cathode / anode / mine relationship) are listed
# with `shared_with_tesla_rel:` and abbreviated notes; the canonical evidence
# remains in tesla.yaml. Ford-specific tier-2 / tier-3 edges (POSCO-Pilbara
# JV LiOH bound for LGES NMC for Mach-E, Vale Voisey's Bay -> LGES, etc.) get
# full FORD_REL_ entries.

supply_relationships:

  # ===========================================================================
  # TIER 1 — Ford -> Cell Maker
  # ===========================================================================

  - id: FORD_REL_001
    tier: 1
    downstream: {company: Ford, product_id: FORD_MACHE_SR}
    upstream:   {company: CATL, facility: Changshu (Jiangsu, CN)}
    material: LFP cells (prismatic, ~70 kWh pack equivalent)
    chemistry: LFP
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: 100
    quantity_estimate: null
    source_ids: [REF_FORD_SUSTAIN_2023, REF_FORD_IRA_30D_2024, REF_REUTERS_FORD_LFP_2023, REF_CATL_ESG_2023]
    notes: |
      CATL Changshu prismatic LFP -> Ford Mach-E SR. Ford May-2023 press
      release ("Ford to bring CATL LFP technology to North America") names
      CATL as supplier. IRA 30D 2024 list: Mach-E SR not eligible (FEOC
      content) — only CATL among Ford partners triggers FEOC, confirming
      the relationship. CATL ESG 2023 lists Ford among LFP customers.
      Single-source (CATL only) for SR for 2023-2024 period; BYD historic
      mention (2022 reporting) not confirmed for current MYs (see GAP).

  - id: FORD_REL_002
    tier: 1
    downstream: {company: Ford, product_id: FORD_MACHE_ER}
    upstream:   {company: LG Energy Solution, facility: Holland MI (US)}
    material: NMC cells (pouch, ~91 kWh pack equivalent)
    chemistry: NMC622 / NMC811
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: 70
    source_ids: [REF_FORD_SUSTAIN_2023, REF_LGES_SR_2023, REF_FORD_10K_2023]
    notes: |
      Ford 2023 Integrated Sustainability Report names LGES as Mach-E NMC
      cell partner; LGES SR 2023 names Ford among major NMC pouch customers.
      LGES Holland (Michigan) is the primary supply node for North American
      Mach-E ER builds. 70/30 share between Holland and Wroclaw is an
      industry estimate (Reuters / Automotive News reporting on Mach-E pack
      logistics). Ford does not publish the geographic split.

  - id: FORD_REL_003
    tier: 1
    downstream: {company: Ford, product_id: FORD_MACHE_ER}
    upstream:   {company: LG Energy Solution, facility: Wroclaw (PL)}
    material: NMC cells (pouch)
    chemistry: NMC622 / NMC811
    period: "2023-2024"
    confidence: industry_reporting
    share_estimate_pct: 30
    source_ids: [REF_LGES_SR_2023, REF_REUTERS_FORD_LFP_2023]
    notes: |
      Wroclaw historically supplied earlier (2021-2022) Mach-E ER and continues
      partial supply through 2023-2024 alongside Holland MI for Cuautitlán-
      bound packs. LGES SR 2023 names Wroclaw as a key plant; Ford does not
      publicly attribute Mach-E share by plant. Industry-reported, not Ford
      attested.

  # ===========================================================================
  # TIER 2 — Cell Maker -> Cathode / Anode / Raw Material
  # ===========================================================================
  # Most CATL upstream and LGES upstream relationships are identical to those
  # already documented in tesla.yaml (Hunan Yuneng -> CATL LFP CAM; POSCO
  # Future M / L&F / EcoPro BM -> LGES NMC CAM; BTR -> graphite anode for
  # both; Tianqi / Ganfeng -> Li for CATL; Vale / BHP / Allkem / Glencore ->
  # LGES Ni-Co-Li raw materials). They are NOT duplicated. Listed below as
  # Ford-relevant edges with `shared_with_tesla_rel:` cross-references.
  #
  # Ford-bilateral entries (POSCO-Pilbara LiOH bound for LGES NMC supplied to
  # Ford, Vale-Ford / Vale-LGES Voisey's Bay specifically named for LGES) get
  # their own FORD_REL_ IDs.
  # ===========================================================================

  # ---------- CATL upstream for Mach-E SR (LFP) ----------
  - id: FORD_REL_020
    tier: 2
    downstream: {company: CATL, facility: Changshu (CN)}
    upstream:   {company: Hunan Yuneng New Energy Battery Material, facility: Hunan + Sichuan (CN)}
    material: LFP cathode active material
    chemistry: LFP
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: 50
    quantity_estimate: ">100,000 t/yr LFP CAM equivalent (industry estimate, all CATL plants)"
    source_ids: [REF_HUNAN_YUNENG_PROSPECTUS, REF_CATL_ESG_2023]
    shared_with_tesla_rel: REL_020
    notes: |
      Hunan Yuneng -> CATL LFP CAM is the same upstream relationship as
      tesla.yaml/REL_020. Ford's Mach-E SR LFP packs draw from the same CATL
      LFP CAM pool. No Ford-specific allocation disclosed; the edge is
      structurally shared between Ford SR, Tesla SR, and many other CATL
      LFP customers.

  - id: FORD_REL_021
    tier: 2
    downstream: {company: CATL, facility: Ningde + Changshu (CN)}
    upstream:   {company: Brunp Recycling, facility: Foshan / Yichang (CN)}
    material: recycled LFP CAM + Li/Fe/P feedstock
    chemistry: LFP (recycled stream)
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    source_ids: [REF_CATL_ESG_2023]
    shared_with_tesla_rel: REL_021
    notes: Brunp is CATL subsidiary; internal recycled-content flow. Same as Tesla.

  - id: FORD_REL_022
    tier: 2
    downstream: {company: CATL, facility: Changshu (CN)}
    upstream:   {company: BTR New Material Group, facility: Heilongjiang + Inner Mongolia (CN)}
    material: graphite anode (natural + synthetic blend for LFP cells)
    chemistry: graphite anode
    period: "2023-2024"
    confidence: industry_reporting
    share_estimate_pct: null
    source_ids: [REF_CATL_ESG_2023, REF_BTR_AR_2023]
    shared_with_tesla_rel: REL_024
    notes: |
      Ford-specific: CATL Changshu's anode supply is structurally the same
      as Ningde's (BTR primary, Shanshan secondary). Ford's LFP cells use
      anode from this pool; no Ford-specific BTR allocation publicly
      disclosed. Confidence intentionally industry_reporting (vs. confirmed
      for Tesla REL_024) because tesla.yaml's evidence chain
      (REF_CATL_ESG_2023 + REF_BTR_AR_2023) names CATL but not Ford
      directly.

  - id: FORD_REL_023
    tier: 2
    downstream: {company: CATL, facility: Changshu / Ningde (CN)}
    upstream:   {company: Tianqi Lithium, facility: Sichuan (CN) + Kwinana (AU)}
    material: lithium carbonate (Li2CO3, battery-grade) for LFP
    chemistry: Li
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    source_ids: [REF_CATL_ESG_2023, REF_TIANQI_AR_2023]
    shared_with_tesla_rel: REL_026
    notes: |
      Same Tianqi -> CATL Li2CO3 offtake as Tesla REL_026. Mach-E SR LFP
      ultimately ties back to Greenbushes spodumene via Tianqi-Albemarle JV
      (see FORD_REL_060). Carbonate (not hydroxide) is the LFP-relevant
      lithium form.

  - id: FORD_REL_024
    tier: 2
    downstream: {company: CATL, facility: Changshu / Ningde (CN)}
    upstream:   {company: Ganfeng Lithium, facility: Jiangxi (CN)}
    material: lithium carbonate / hydroxide
    chemistry: Li
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    source_ids: [REF_GANFENG_AR_2023, REF_CATL_ESG_2023]
    shared_with_tesla_rel: REL_027
    notes: Same Ganfeng -> CATL Li offtake as Tesla REL_027.

  # ---------- LGES upstream for Mach-E ER (NMC) ----------
  - id: FORD_REL_030
    tier: 2
    downstream: {company: LG Energy Solution, facility: Holland MI (US) + Wroclaw (PL)}
    upstream:   {company: POSCO Future M, facility: Gwangyang (KR)}
    material: NMC cathode active material (high-Ni)
    chemistry: NMC811 / NMC622
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    quantity_estimate: ">40,000 t/yr CAM (industry estimate, all POSCO Future M output to LGES)"
    source_ids: [REF_LGES_SR_2023, REF_POSCO_FUTUREM_SR_2023, REF_FORD_SUSTAIN_2023]
    shared_with_tesla_rel: REL_033
    notes: |
      POSCO Future M is LGES's primary high-Ni NMC CAM supplier (Gwangyang,
      KR). Ford's 2023 Integrated Sustainability Report and LGES SR both
      identify POSCO Future M as a Ford-relevant cathode partner via LGES.
      Mach-E ER NMC packs draw from this CAM pool.

  - id: FORD_REL_031
    tier: 2
    downstream: {company: LG Energy Solution, facility: Holland MI (US) + Wroclaw (PL)}
    upstream:   {company: L&F, facility: Daegu (KR)}
    material: NMC cathode active material (high-Ni)
    chemistry: NMC811
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    source_ids: [REF_LGES_SR_2023, REF_LANDF_AR_2023]
    shared_with_tesla_rel: REL_034
    notes: L&F -> LGES NMC; same CAM pool as Tesla. No Ford-specific allocation disclosed.

  - id: FORD_REL_032
    tier: 2
    downstream: {company: LG Energy Solution, facility: Holland MI (US) + Wroclaw (PL)}
    upstream:   {company: EcoPro BM, facility: Pohang (KR)}
    material: NMC cathode active material
    chemistry: NMC
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    source_ids: [REF_LGES_SR_2023, REF_ECOPRO_AR_2023]
    shared_with_tesla_rel: REL_035
    notes: EcoPro BM -> LGES NMC; same CAM pool as Tesla.

  - id: FORD_REL_033
    tier: 2
    downstream: {company: LG Energy Solution, facility: Holland MI (US) + Wroclaw (PL)}
    upstream:   {company: BTR New Material Group, facility: Heilongjiang + Inner Mongolia (CN)}
    material: graphite anode (synthetic + natural)
    chemistry: graphite anode
    period: "2023-2024"
    confidence: industry_reporting
    share_estimate_pct: null
    source_ids: [REF_LGES_SR_2023, REF_BTR_AR_2023]
    notes: |
      LGES sources graphite anode from BTR (primary) and Shanshan (secondary)
      — same Chinese-supply structure as CATL. Mach-E ER's anode is BTR-
      sourced but specific Heilongjiang mine attribution is opaque (see
      FORD_GAP_002). Industry_reporting because LGES SR 2023 names BTR
      but not Ford-specific allocation.

  - id: FORD_REL_034
    tier: 2
    downstream: {company: LG Energy Solution, facility: Holland MI (US)}
    upstream:   {company: Vale Canada (Vale Base Metals), facility: "Voisey's Bay (NL) + Sudbury (ON), Long Harbour refinery (CA)"}
    material: nickel sulfate (battery-grade) / Ni intermediates
    chemistry: Ni
    period: "2023-2024 (multi-year offtake announced 2022, deliveries from 2025)"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    quantity_estimate: "~25,000 t Ni / yr starting 2025 (announced 2022)"
    source_ids: [REF_VALE_GM_LGES_PR_2022, REF_LGES_SR_2023, REF_VALE_AR_2023]
    shared_with_tesla_rel: REL_036
    notes: |
      Vale Canada -> LGES Ni offtake (2022 PR) is the same instrument as
      tesla.yaml/REL_036; the Ford pull-through is via LGES Holland MI
      output to Mach-E ER. Voisey's Bay (Newfoundland & Labrador) is the
      nickel-cobalt mine; Long Harbour (NL) refines to intermediate; battery-
      grade Ni sulfate finishing at Bécancour QC JV plant (Vale + GM, online
