    chemistry: Li
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    source_ids: [REF_ALLKEM_AR_2023, REF_LGES_SR_2023]
    shared_with_tesla_rel: REL_037
    notes: Allkem (now Arcadium) -> LGES Li; same pool as Tesla.

  - id: FORD_REL_037
    tier: 2
    downstream: {company: POSCO Future M, facility: Gwangyang (KR)}
    upstream:   {company: "POSCO-Pilbara Lithium Solution (POSCO 82% / Pilbara 18% JV)", facility: "Gwangyang LiOH plant (KR)"}
    material: lithium hydroxide (LiOH·H2O, battery-grade)
    chemistry: Li
    period: "2024+"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    quantity_estimate: "43,000 t/yr LiOH nameplate (Train 1 + Train 2 combined; Train 1 commissioned 2024)"
    source_ids: [REF_POSCO_FUTUREM_SR_2023, REF_PILBARA_AR_2023]
    shared_with_tesla_rel: REL_063
    notes: |
      Same POSCO-Pilbara JV LiOH plant as Tesla REL_063. Vertically
