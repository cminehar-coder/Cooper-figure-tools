# =============================================================================
# GAPS — Documented unknowns that block end-to-end traceability
# =============================================================================

gaps:

  - id: FORD_GAP_001
    chain_step: "Mach-E SR LFP — second-source cell maker confirmation"
    affected_products: [FORD_MACHE_SR]
    description: |
      Some 2022-era reporting (Reuters, Automotive News) suggested BYD as a
      potential secondary LFP cell supplier for Mach-E SR. As of 2023-2024,
      Ford's IRA 30D filing and Sustainability Report only name CATL.
      Whether BYD is a current backup is not publicly verified. May or
      may not be active in 2024 model year.
    needs: Ford_2024_disclosure | IRA_2025_supplier_list
    blocks_chains:
      - "Ford Mach-E SR -> BYD? -> ? (unverified secondary LFP path)"

  - id: FORD_GAP_002
    chain_step: "BTR / Shanshan natural-graphite mine attribution for LGES NMC + CATL LFP"
    affected_products: [FORD_MACHE_SR, FORD_MACHE_ER]
    description: |
      Same opacity issue as tesla.yaml/GAP_002. Heilongjiang flake-graphite
      mining is fragmented across small private operators aggregated through
      trading houses before reaching BTR / Shanshan spheronization plants.
      Mine-level attribution unavailable in BTR AR 2023; LGES SR 2023 and
      CATL ESG 2023 stop at company-level supplier naming. Both Mach-E
      trims affected (BTR is the dominant graphite anode supplier for both
      CATL and LGES).
    needs: paid_database_access | Chinese_government_disclosure
    blocks_chains:
      - "Ford Mach-E SR -> CATL Changshu -> BTR -> Heilongjiang graphite mine"
      - "Ford Mach-E ER -> LGES Holland/Wroclaw -> BTR -> Heilongjiang graphite mine"

  - id: FORD_GAP_003
    chain_step: "POSCO Argentina Salar — specific block for Mach-E ER attribution"
    affected_products: [FORD_MACHE_ER]
    description: |
      POSCO Holdings owns the Hombre Muerto Norte (Salta, AR) Li brine
      project (operational from 2023-2024) and feeds Li2CO3 / LiOH into
      POSCO Future M's CAM stream. Whether the Argentina-sourced Li
      specifically lands in Mach-E ER NMC (vs. domestic Korean-customer
      vehicles or other LGES OEMs) is not publicly attributed at the SKU
      level. Likely shared, not Ford-exclusive.
    needs: POSCO_disclosure | LGES_disclosure
    blocks_chains:
      - "Ford Mach-E ER -> LGES -> POSCO Future M -> POSCO Argentina Salar (block-level unattributed)"

  - id: FORD_GAP_004
    chain_step: "POSCO / LGES Indonesian HPAL Ni mine attribution"
    affected_products: [FORD_MACHE_ER]
    description: |
      POSCO Future M's Ni precursor partly comes from the POSCO-Huayou
      Indonesia HPAL JV (Halmahera Persada Lygend / Morowali). Specific
      Sulawesi or Halmahera mine block -> matte -> NiSO4 attribution is
      shared with CATL/Tesla GAP_001 in tesla.yaml. POSCO Future M SR 2023
      stops at country level. Ford-specific allocation undisclosed.
    needs: paid_database_access | Indonesian_disclosure | POSCO_disclosure
    blocks_chains:
      - "Ford Mach-E ER -> LGES -> POSCO Future M -> Indonesian HPAL Ni mine (block unknown)"

  - id: FORD_GAP_005
    chain_step: "DRC cobalt mine -> POSCO/L&F/EcoPro BM cathode for LGES Mach-E ER"
    affected_products: [FORD_MACHE_ER]
    description: |
      Glencore (KCC + Mutanda DRC), CMOC (Tenke Fungurume DRC), and ERG
      (Metalkol RTR DRC) all supply Co into the Korean cathode supply chain
      via Chinese refining tolling (Huayou / GEM / Hanrui). Specific DRC
      concession -> Korean cathode -> LGES Mach-E ER attribution is a
      blended flow without per-OEM allocation. POSCO Future M SR 2023
      and Glencore AR 2023 disclose at company level only. The Tesla-
      Glencore bilateral PR (tesla.yaml/REL_028) is Tesla-specific and
      does not extend to Ford.
    needs: Korean_FSS_filings | Glencore_per_customer_disclosure | OECD_DRC_traceability
    blocks_chains:
      - "Ford Mach-E ER -> LGES -> [POSCO/L&F/EcoPro BM] -> [Glencore/CMOC/ERG] -> DRC mine (specific concession)"

  - id: FORD_GAP_006
    chain_step: "Mn supply chain for Mach-E ER NMC"
    affected_products: [FORD_MACHE_ER]
    description: |
      Same as tesla.yaml/GAP_011. Mn is the lowest-attributed of NMC
      inputs. Likely sources via Chinese MnSO4 plants drawing on South
      Africa (Assmang, South32 Hotazel), Gabon (Eramet COMILOG), Australia
      (South32 GEMCO until divestiture). Ford 2023 Sustainability Report
      does not name Mn supplier; LGES SR 2023 mentions Mn supply diligence
      generically.
    needs: paid_database_access | LGES_2024_SR
    blocks_chains:
      - "Ford Mach-E ER -> LGES -> POSCO/L&F/EcoPro BM -> MnSO4 -> ZA / Gabon / AU Mn mine"

  - id: FORD_GAP_007
    chain_step: "Mexico build vs US-import — pack assembly attribution"
    affected_products: [FORD_MACHE_SR, FORD_MACHE_ER]
    description: |
      Mach-E final vehicle assembly is at Cuautitlán (Mexico). Pack-level
      assembly point: cells/modules ship to Cuautitlán from CATL Changshu
      (SR) and LGES Holland MI / Wroclaw (ER); pack-level integration
      done at Cuautitlán per Ford 2023 Sustainability Report. Whether any
      US-built Mach-E (e.g. modules pre-assembled in US then shipped)
      exists is not separately disclosed. Affects USMCA / IRA value-add
      calculation but does not change the cell-source attribution
      established in FORD_REL_001-003.
    needs: Ford_disclosure | USMCA_origin_certificates
    blocks_chains:
      - "Pack-assembly geographic attribution (vs cell-source) — refinement only"

  - id: FORD_GAP_008
    chain_step: "LGES Wroclaw vs Holland MI volume split for Mach-E ER"
    affected_products: [FORD_MACHE_ER]
    description: |
      Industry reporting estimates ~70% Holland MI / ~30% Wroclaw for
      2023-2024 Mach-E ER cells, but neither LGES SR 2023 nor Ford 2023
      Sustainability Report publish per-plant volume to Mach-E. FORD_REL_002
      and FORD_REL_003 share estimates are industry_reporting only.
    needs: LGES_disclosure | Ford_disclosure
    blocks_chains:
      - "Ford Mach-E ER -> LGES (Holland vs Wroclaw share, geographic attribution)"


