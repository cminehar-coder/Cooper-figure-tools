  - id: FORD_REL_036
    tier: 2
    downstream: {company: LG Energy Solution, facility: Holland MI (US) + Wroclaw (PL)}
    upstream:   {company: Allkem (now Arcadium Lithium), facility: "Olaroz (AR) + Mt Cattlin (AU)"}
