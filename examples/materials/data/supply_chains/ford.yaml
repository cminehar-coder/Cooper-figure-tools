      clearest fully-traceable Li chain for Mach-E ER.

  - id: FORD_REL_038
    tier: 2
    downstream: {company: POSCO Future M, facility: Gwangyang (KR)}
    upstream:   {company: POSCO Holdings (parent), facility: "Pohang (KR) + Indonesia HPAL JV (Halmahera/Morowali via Huayou partnership)"}
    material: nickel sulfate / Ni mixed hydroxide precipitate (MHP)
    chemistry: Ni
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    source_ids: [REF_POSCO_FUTUREM_SR_2023]
    shared_with_tesla_rel: REL_064
    notes: |
      POSCO Future M's Ni precursor primarily from POSCO Holdings'
      integrated Ni complex. Indonesian HPAL JV with Huayou is partly the
      same intermediate stream as the Tsingshan/Huayou Indonesian Ni that
      reaches CATL (see GAP_001 in tesla.yaml). For Ford Mach-E ER, the
      flow closes at country-level (Indonesia) with specific Sulawesi /
      Halmahera block undisclosed (see FORD_GAP_004).

  - id: FORD_REL_039
