      other Ni sources via LGES) until Bécancour ramps.

  - id: FORD_REL_035
    tier: 2
    downstream: {company: LG Energy Solution, facility: Holland MI (US) + Wroclaw (PL)}
    upstream:   {company: BHP Nickel West, facility: "Kwinana (AU) + Kalgoorlie (AU)"}
    material: nickel sulfate (battery-grade)
    chemistry: Ni
    period: "2023-2024"
    confidence: confirmed_public_disclosure
    share_estimate_pct: null
    source_ids: [REF_BHP_AR_2023, REF_LGES_SR_2023]
    notes: |
      BHP Nickel West -> LGES Ni sulfate. BHP AR 2023 names LGES among
      Kwinana Ni sulfate plant offtake counterparties (alongside Tesla via
      Panasonic, Toyota). LGES SR 2023 reciprocally lists BHP. Ford pull-
