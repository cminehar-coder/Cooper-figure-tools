      method: >
        Strongly deposit-grade dependent. Battery-grade natural graphite:
          China (Heilongjiang/Shandong): 5-10% Cg, 80-85% recovery.
          Mozambique (Syrah Resources Balama): 10-16% Cg, ~88% recovery.
          Madagascar (NextSource): 5-8% Cg.
        Central: 8% Cg grade, 85% recovery:
          Ore = (F051 concentrate) / (grade*recovery) = 1.978/(0.08*0.85) = 29.1 kg/kWh.
        Low: 12% Cg, 87% recovery (Mozambique-type): 1.978/(0.12*0.87) = 18.9 -> ~13 at
          lower spheronization loss end (0.60 yield).
        High: 5% Cg, 78% recovery (marginal Chinese deposit): 1.978/(0.05*0.78) = 50.7 -> ~55.
