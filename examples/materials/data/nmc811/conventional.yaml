  - id: F051
    from: beneficiation
    to: anode_mfg
    material: graphite concentrate (high-purity flake, >=94% Cg)
    material_id: GRAPHITE_CONC
    value: 1.978
    unit: kg_per_kWh
    uncertainty:
      low: 1.48
      high: 2.65
      method: >
        F051 = F052 / spheronization_yield.
        Spheronization yield range: 40-60%. This is the DOMINANT UNCERTAINTY in graphite chain.
        At 40% yield: 0.89/0.40 = 2.225 -> high end.
        At 60% yield: 0.89/0.60 = 1.483 -> low end.
        High bound 2.65 includes additional purification losses (~5%).
        Low bound 1.48 assumes 60% spheronization yield (optimistic industrial scenario).
        GREET 2023 uses 44% spheronization yield -> F051 = 0.89/0.44 = 2.02 kg/kWh (close).
        Degen 2023: footnotes ~44-52% yield from flake to SPNG.
        Pell 2021: ~50% yield (less conservative) -> 0.89/0.50 = 1.78 kg/kWh.
    yield_fraction: 0.45
    loss_destination: waste
    is_loss: false
    source_ids:
      - REF_GREET_2023
      - REF_DEGEN_2023
      - REF_PELL_2021
      - REF_IEA_2023_CMR
    notes: >
      DERIVATION: F051 = 0.89 kg SPNG/kWh / 0.45 spheronization yield = 1.978 kg/kWh.
      Spheronization is the critical loss point in natural graphite processing.
      Flake graphite specification entering spheronization: >=94% Cg, D50 100-300 µm
        (coarse flake preferred; finer flake has worse spheronization yield).
      Spheronization process: impact/pin mill or jet mill -> spherical SPNG (D50 15-20 µm)
        + fines (D50 <10 µm, ~40-55% of input mass).
      FINES CO-PRODUCT: Spheronization fines are not wasted — they are sold as:
        - Expandable graphite (flame retardant, building materials)
        - Graphite lubricants and dry lubricants
        - Carbon black feedstock / thermal graphite
        If system expansion is applied for fines co-product, effective graphite burden
        to battery supply chain decreases. Most published LCAs use cut-off method (ignore
        fines co-product credit), making this a conservative upper-bound for graphite load.
      Purification after spheronization: thermal (2800°C Acheson furnace) or chemical
        (HF/HCl acid wash) -> final product >99.95% Cg. Yield ~95-98% in purification step.
    region_breakdown:
      - region: CN
        share_pct: 70.0
        value: 1.385
