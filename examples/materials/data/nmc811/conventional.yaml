  # ---------------------------------------------------------------------------
  # PRECURSOR → CAM
  # ---------------------------------------------------------------------------

  - id: F040
    from: precursor_mfg
    to: cam_mfg
    material: NMC811 hydroxide precursor (PCAM)
    material_id: PCAM_NMC811
    value: 1.44
    unit: kg_per_kWh
    uncertainty:
      low: 1.30
      high: 1.58
      method: >
        Stoichiometric PCAM/CAM ratio: Ni0.8Mn0.1Co0.1(OH)2 MW = 94.355 g/mol.
        CAM MW = 97.28 g/mol. Calcination mass balance:
          PCAM(94.36g) + LiOH(23.948g) + 1/4 O2 -> CAM(97.28g) + 3/2 H2O(27.02g)
        (solid-phase: 94.36 + 6.941(Li from LiOH) - 4.021(H2O from 2-OH) = 97.28 OK)
        PCAM/CAM mass ratio = 94.355/97.28 = 0.9699.
        CAM per kWh = 1.435; PCAM ideal = 1.435*0.9699 = 1.392 kg/kWh.
        Calcination TM yield ~97% (dust/sieving losses): 1.392/0.97 = 1.435.
        Co-precipitation yield ~97%: 1.435/0.97 = 1.479. Rounded to 1.44 accounting for
        internal recycle of some off-spec PCAM back to reactor.
        Low: 98% calcination, 99% co-precip: 1.392/(0.98*0.99) = 1.435 -> ~1.30 at
          lower CAM demand (higher cell energy density, 200 mAh/g).
        High: 95% calcination, 96% co-precip: 1.392/(0.95*0.96) = 1.527 -> ~1.58.
    yield_fraction: 0.97
    loss_destination: waste
    is_loss: false
    source_ids:
      - REF_GREET_2023
      - REF_DEGEN_2023
      - REF_PELL_2021
      - REF_KWADE_2018
    notes: >
      DERIVATION: PCAM = Ni0.8Mn0.1Co0.1(OH)2, produced by co-precipitation.
      Molecular weights (g/mol):
        Ni0.8: 0.8*58.693 = 46.954
        Mn0.1: 0.1*54.938 = 5.494
        Co0.1: 0.1*58.933 = 5.893
        (OH)2: 2*(15.999+1.008) = 34.014
        PCAM MW = 94.355 g/mol
      Mass ratio PCAM/CAM = 94.355/97.28 = 0.9699.
      CAM per kWh = 1.435; PCAM theoretical = 1.435*0.9699 = 1.392 kg/kWh.
      Adding processing losses (calcination dust ~1%, sieving rejects ~1-2%,
        off-stoichiometry batches ~1%) -> PCAM input per kg CAM output ~1.035.
      PCAM/kWh = 1.392 * 1.035 = 1.441 -> 1.44 kg/kWh.
      Co-precipitation process: pH 11-12, 50-60°C, N2 atmosphere, CSTR reactor.
      PCAM morphology: secondary particles 10-15 µm, tap density 1.5-2.0 g/cc,
        BET 8-15 m2/g. Controls CAM microstructure and performance.
      Yield_fraction 0.97: 3% of TM ions lost to mother liquor in co-precipitation;
        mother liquor treated (pH adjustment) and TM recovered by wastewater treatment
        or (in closed-loop plants) recycled back to reactor.
    region_breakdown:
      - region: CN
        share_pct: 70.0
        value: 1.008
        companies:
          - CNGR
          - GEM
          - Brunp (CATL subsidiary)
          - Huayou Cobalt
          - Ronbay Technology
        source_ids:
          - REF_IEA_2023_CMR
        notes: >
          China dominates PCAM (especially co-precipitation hydroxide route);
          ~70% of global precursor capacity. Many Chinese PCAM makers vertically
          integrate to NiSO4/CoSO4 and even Indonesian HPAL.
      - region: KR
        share_pct: 17.0
        value: 0.245
        companies:
          - POSCO Future M
          - EcoPro BM (precursor sister EcoPro Materials)
          - L&F (precursor partnership)
        source_ids:
          - REF_IEA_2023_CMR
        notes: Korean PCAM ramped 2022–2024; supplies KR CAM makers (LG Chem, etc.).
      - region: JP
