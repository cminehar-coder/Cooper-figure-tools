        notes: >
          China holds >90% of global spheronization + purification capacity per
          IEA CMR 2023. The thermal-purification (Acheson 2800°C) and HF acid
          purification routes are both Chinese-dominant. Major battery anode supply
          risk concentrated here.
      - region: US
