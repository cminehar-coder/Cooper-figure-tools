  - id: F062
    from: chem_processing
    to: electrode_mfg
    material: aluminum foil (cathode current collector)
    material_id: AL_FOIL
    value: 0.150
    unit: kg_per_kWh
    uncertainty:
      low: 0.12
      high: 0.18
      method: >
        Al foil thickness 12-16 µm @ density 2.70 g/cc (BatPaC v5; Lain 2019).
        Cathode coating area calculated from CAM mass and loading:
          Total coated area (both sides) = 1.435 kg / 0.020 g/cm² = 71,750 cm² of coated face.
          Foil area (double-sided coating) = 71,750/2 = 35,875 cm² per kWh.
        Central: 15 µm Al, 2.70 g/cc -> areal mass = 4.05 mg/cm².
          Foil mass = 35,875 × 4.05e-3 = 145 g; with 5% slitting/edge scrap: 145/0.95 = 153 g
          -> 0.150 kg/kWh.
        Low: 12 µm Al -> 3.24 mg/cm² × 35,875 / 0.95 = 122 g -> 0.12 kg/kWh.
        High: 16 µm Al -> 4.32 mg/cm² × 35,875 / 0.95 = 163 g -> 0.18 kg/kWh
        (also captures lower CAM utilization scenario at 175 mAh/g).
    yield_fraction: 0.95
    loss_destination: waste
    is_loss: false
    source_ids: [REF_PNNL_BatPaC, REF_LAIN_2019, REF_KWADE_2018, REF_GREET_2023]
    notes: >
      DERIVATION:
        Cathode loading 20 mg/cm² (one face) × 2 faces of foil double-sided coating
          -> areal CAM = 40 mg/cm² of foil.
