  - id: F080
    from: module_assembly
    to: pack_mfg
    material: battery modules
    material_id: null
    value: 3.93
    unit: kg_per_kWh
    uncertainty:
      low: 3.74
      high: 4.10
      method: >
        Module overhead (busbars, TIM, end-plates, cell holders, module housing, harness):
          5-15% of cell mass for cylindrical 21700 modules (BatPaC v5; Cusenza 2022).
          Central: 10% overhead × 3.57 cell = 0.36 -> module = 3.93 kg/kWh.
        Low: 5% overhead (cell-to-pack-like format) -> 3.57 × 1.05 = 3.74 kg/kWh.
        High: 15% overhead (older/heavier modules) -> 3.57 × 1.15 = 4.10 kg/kWh.
        Module assembly yield ~99% (mature, mostly mechanical/welding).
    yield_fraction: 0.99
    loss_destination: waste
    is_loss: false
    source_ids: [REF_PNNL_BatPaC, REF_CUSENZA_2022, REF_LAIN_2019]
    notes: >
      DERIVATION: Module mass = cell mass × (1 + module_overhead_fraction).
        Cell mass (F070) = 3.57 kg/kWh.
        Module overhead central = 10% (BatPaC v5 cylindrical 21700 default).
        Module = 3.57 × 1.10 = 3.927 -> 3.93 kg/kWh.
