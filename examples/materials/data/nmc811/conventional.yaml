  - id: F100
    from: application
    to: eol_recycling
    material: end-of-life battery pack
    material_id: null
    value: 5.30
    unit: kg_per_kWh
    uncertainty:
      low: 4.85
      high: 6.15
      method: >
        EoL pack mass equals BoL pack mass (F090): physical mass conserved during use,
        only capacity fades. Range mirrors F090 uncertainty.
        Effective recycling-stream mass per kWh-of-original-installation depends on
        collection rate (currently ~50% global avg, rising to 80-90% in policy-driven
        markets — EU Battery Regulation 2023, China extended producer responsibility).
        Reported here as full pack mass (collection rate applied at next stage).
    yield_fraction: 1.00
    loss_destination: waste
    is_loss: false
    source_ids: [REF_HARPER_2019, REF_CUSENZA_2022, REF_IEA_2023_GEO]
    notes: >
      DERIVATION: EoL pack mass = F090 = 5.30 kg/kWh (physical mass conservation through
      service life; no mass change, only capacity fade ~20-30% over 8-15 years).
      NMC811 packs typical service life: 10-15 years in EV (~1500-2000 cycles to 80% SOH);
        2nd-life stationary use can extend by 5-8 years before recycling (less common
        than for LFP due to higher Ni/Co value supporting earlier recycling).
      Collection rate (not yet broken out as separate flow): 50-60% global 2024;
        EU/China policy targets >70% by 2030. Uncollected packs sent to landfill or
        informal dismantling — not modelled here.
      Pre-recycling steps (discharge, dismantle to module/cell, deactivate) not separately
      tracked; treated as internal to eol_recycling node.
