  - id: F041
    from: cam_mfg
    to: electrode_mfg
    material: NMC811 cathode active material (CAM)
    material_id: CAM_NMC811
    value: 1.435
    unit: kg_per_kWh
    uncertainty:
      low: 1.28
      high: 1.60
      method: >
        Central from stoichiometry: 1000 Wh / (190 mAh/g * 3.67 V) = 1.435 kg/kWh.
        Low: 200 mAh/g (optimistic, coin-cell-like conditions) at 280 Wh/kg: 1.362 kg/kWh;
          accounting for manufacturing scrap ~98% yield -> ~1.28 lower bound.
        High: 175 mAh/g (conservative, thick electrode, aged performance) at 280 Wh/kg:
          1.559 kg/kWh; at 95% electrode yield -> ~1.60.
        GREET 2023: 1.36-1.52 kg/kWh (cell energy density 250-300 Wh/kg range).
        Degen 2023 Table 1: ~1.40-1.50 kg/kWh for NMC811 at 240-270 Wh/kg.
        Pell 2021: ~1.42 kg/kWh at 230 Wh/kg -> scaling to 280 Wh/kg: 1.166 kg/kWh.
        [Pell 2021 scaled value is lower; reflects thinner electrode/different design basis]
    yield_fraction: 0.97
    loss_destination: waste
    is_loss: false
    source_ids:
      - REF_GREET_2023
      - REF_DEGEN_2023
      - REF_PELL_2021
      - REF_LAIN_2019
    notes: >
      DERIVATION (stoichiometric):
        NMC811 practical specific discharge capacity: 190 mAh/g.
          Basis: commercial 21700 cells, C/3 rate, 2.5-4.3 V, 25°C, fresh.
          Literature consensus range: 185-200 mAh/g.
          Higher values (>200 mAh/g) typically from coin cells with Li-metal counter electrode
          or half-cell data; not representative of commercial full-cell performance.
        Average discharge voltage vs. graphite: 3.67 V (area-weighted from dV/dQ curve).
        CAM specific energy = 190 mAh/g * 3.67 V = 697.3 Wh/kg
        CAM per kWh = 1000 / 697.3 = 1.4341 -> 1.435 kg/kWh
      yield_fraction 0.97: calcination losses from
        - Fines from post-calcination sieving: ~1-2%
        - Off-spec batches (Li/TM out of range, morphology defect): ~1-3%
        - Dust collection losses: <0.5%
      Cross-reference: GREET 2023 ~1.40-1.45 kg/kWh at 280 Wh/kg; Degen 2023 ~1.44; match.
      Calcination: 750-850°C, O2 atmosphere, 10-15 h; rotary or roller-hearth kiln.
      Li/TM molar ratio 1.03-1.05 fed; final Li/TM in product 1.00-1.01.
      CAM spec: D50 = 12-15 µm, tap density >2.3 g/cc, BET <0.5 m2/g,
        Li2CO3 surface residue <0.2%, Ni stoichiometry variance <0.5 wt%.
    region_breakdown:
