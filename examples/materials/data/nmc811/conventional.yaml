      high: 34.0
      method: >
        ECONOMIC ALLOCATION central value (project default convention, 2026-04-30).
        DRC Cu-Co ore: Co grade 0.2-0.4%, recovery ~82%, unallocated = 34.0 kg/kWh.
        Apply economic allocation at 20% Co revenue share (Cu+Co revenue 2022-2023 prices):
          F020 = 34.0 * 0.20 = 6.8 kg/kWh.
        High bound (34.0): full unallocated burden (cut-off / consequential LCA convention).
        Low bound (1.0): mass allocation (Co ~3% of mined metal mass).
        GREET 2023 uses economic allocation (this method); Pell 2021 uses system expansion;
          ISO 14044/PEF prefer economic for byproducts. Convention documented in
          meta.allocation_convention.
