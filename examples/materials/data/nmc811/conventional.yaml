        Total ore-to-SPNG ratio: 29.1/0.89 = 32.7:1 (large due to low grade + spheronization)
      Natural flake graphite: vein or disseminated deposits, open-pit mining.
      China dominates supply (~65-70% of global flake graphite per IEA CMR 2023).
      Heilongjiang province (China): major source, grades ~5-10% Cg, mature supply chain.
