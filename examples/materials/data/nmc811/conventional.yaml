        companies:
          - Northern Graphite (CA)
          - Nouveau Monde Graphite (CA)
        source_ids:
          - REF_USGS_2024_MINYB
        notes: Canada, Sweden, Tanzania, Ukraine, Korea.
    discrepancy_flags:
      - type: source_contradiction
        description: >
          Spheronization yield disagreement: Pell 2021 (60%) vs GREET 2023 (44%).
          Central F051 value uses 45% (close to GREET); Pell 2021 would yield F051 ~1.48 kg/kWh
          vs the central 1.978 — a ~36% difference in flake-to-SPNG mass intensity.
          Both sources cite industry-stated yields. Reconciliation requires direct
          plant-data verification (BTR, Shanshan are commercial operators).
        sources_compared:
          - REF_PELL_2021
          - REF_GREET_2023
        magnitude_pct: 36.0
        status: resolved
        resolution_notes: >
          RESOLVED 2026-04-30 by project-wide convention (Policy 1). Adopted GREET 2023's
          44% spheronization yield as the project default since GREET is the project's
          primary cross-cutting reference. Pell 2021 (60%) is preserved in uncertainty.high.
          Existing yield_fraction value of 0.45 falls within the GREET-aligned range
          (44–45%) and is retained as-is for back-compatibility with derived F051/F052
          masses; 44% is the canonical convention going forward.
    verified: false

  - id: F052
    from: anode_mfg
    to: electrode_mfg
    material: spheronized purified natural graphite (SPNG)
    material_id: GRAPHITE_NAT
    value: 0.89
    unit: kg_per_kWh
    uncertainty:
      low: 0.72
      high: 1.05
      method: >
        Cell mass balance: N/P = 1.10, practical anode capacity = 355 mAh/g.
        Cell capacity at 3.67 V: 1000 Wh / 3.67 V = 272.5 Ah per kWh.
        Anode Ah = 272.5 * 1.10 = 299.8 Ah/kWh.
        SPNG active material = 299.8 Ah / 0.355 Ah/g = 844 g = 0.844 kg/kWh.
        Anode slurry: 95% SPNG -> SPNG input per kWh = 0.844/0.95 = 0.888 -> 0.89 kg/kWh.
        Low: N/P = 1.05, 370 mAh/g, 95% wt%: (272.5*1.05/370)/0.95 = 0.813 -> ~0.72.
        High: N/P = 1.15, 340 mAh/g, 93% wt%: (272.5*1.15/340)/0.93 = 1.000 -> ~1.05.
        GREET 2023 NMC811: ~0.85-0.95 kg graphite/kWh. Central consistent.
        Degen 2023: ~0.88 kg graphite/kWh for NMC811 at 250 Wh/kg.
    yield_fraction: 0.45
    loss_destination: waste
    is_loss: false
    source_ids:
      - REF_GREET_2023
      - REF_DEGEN_2023
      - REF_PELL_2021
      - REF_LAIN_2019
    notes: >
      DERIVATION:
        Cell basis: 1 kWh / 3.67 V = 272.5 Ah capacity
        N/P ratio = 1.10 -> anode capacity = 299.75 Ah
        SPNG practical capacity = 355 mAh/g
          (LiC6 theoretical = 372 mAh/g; practical ~95% utilization in 21700 full cell)
        SPNG active material = 299.75 Ah / 0.355 Ah/g = 844.4 g = 0.844 kg/kWh
        Anode slurry wt% SPNG = 95% (CMC 1.5%, SBR 2.0%, conductive carbon 1.5%)
        SPNG input = 0.844/0.95 = 0.888 -> 0.89 kg/kWh
      SPNG specification: D50 = 15-20 µm, tap density 1.0-1.2 g/cc, BET 3-6 m2/g,
        Cg >99.95%, moisture <0.1%, specific surface area stable after carbon coating.
      Optional carbon coating (~2-3% by weight) to reduce irreversible capacity loss;
        common in commercial 21700 cells (e.g., Panasonic/Tesla NCA cells use similar).
      Yield_fraction 0.45 = spheronization yield recorded here for Sankey reference;
        the physical loss occurs at the F051 node (concentrate -> SPNG).
      Synthetic graphite alternative: petroleum coke graphitized at 2800-3000°C.
        ~1.05-1.10 kg/kWh, ~85-90% graphitization yield, ~3x higher energy intensity.
        Natural graphite pathway used here per project scope.
      GREET 2023: 0.87 kg natural graphite/kWh (within 2% of 0.89 central).
    region_breakdown:
      - region: CN
        share_pct: 92.0
        value: 0.819
        companies:
