        fans + auxiliary). CAM = 1.435 kg/kWh → 14 MJ/kWh.
        Range reflects kiln efficiency (older: 18 MJ/kg; modern: 8 MJ/kg) and
        whether O2 plant electricity is included (~25% of total when on-site PSA).
