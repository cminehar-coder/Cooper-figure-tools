      - type: mass_balance_gap
        description: >
          Mass balance check (after Policy 2 elemental-basis convention adopted 2026-04-30):
          Σ recovered metals (F101+F102+F103) = 0.0875+0.658+0.0825 = 0.828 kg/kWh
          of contained metal. Upstream input metal totals (Li+Ni+Co+Mn in CAM) =
          0.102+0.693+0.087+0.081 = 0.963 kg/kWh. Recovery ratio = 0.828/0.963 = 86%
          (consistent with 85–95% per-element hydromet yields). Residual ~0.135 kg
          metal/kWh stays in F104 leach residue/slag. Mass balance closes cleanly at
          the pack level: F100 (5.30) = F101+F102+F103 (0.828) + F104 (4.47) = 5.30.
        magnitude_pct: 14.0
        status: resolved
        resolution_notes: >
          RESOLVED 2026-04-30 by Policy 2 (elemental-basis recycling convention).
          F101–F103 now report contained-metal mass; F104 closes mass balance cleanly.
          See AUDIT_RECYCLING_COMPOUND_VS_ELEMENTAL_BASIS for full methodology.
    verified: true

  - id: F101
    from: eol_recycling
    to: chem_processing
    material: recovered lithium (elemental basis)
    material_id: LI_ELEMENTAL
    value: 0.0875
    unit: kg_per_kWh
    uncertainty:
      low: 0.082
      high: 0.094
      method: >
        ELEMENTAL BASIS (Policy 2, project-wide convention 2026-04-30).
        Li in CAM = 0.1024 kg Li/kWh (= 1.435 × 0.07134, see F003 derivation).
        Hydromet recovery rate (Harper 2019): 80-90% for NMC; central 85%.
        Recovered Li (elemental) = 0.1024 × 0.85 ≈ 0.0875 kg Li/kWh.
        Low: 80% recovery (current commercial avg, e.g. Umicore, Redwood) -> 0.0820.
        High: 92% recovery (advanced direct recycling / EU 2031 target) -> 0.0942.
        PRIOR VALUE (compound-equivalent LiOH·H2O): 0.526 kg/kWh; converted to elemental
        by Li/LiOH·H2O = 16.541% mass fraction.
    yield_fraction: 0.85
    is_loss: false
    is_recycled: true
    source_ids: [REF_HARPER_2019, REF_CUSENZA_2022, REF_GREET_2023]
    notes: >
      DERIVATION (ELEMENTAL BASIS, Policy 2):
        Li per kWh in CAM = 1.435 × 7.134% = 0.1024 kg Li/kWh (stoichiometric anchor).
        Hydromet recovery from black mass: 80-90% (Harper 2019; central 85%).
        Recovered Li mass (elemental) = 0.1024 × 0.85 ≈ 0.0875 kg/kWh.
      Reported on ELEMENTAL BASIS per project convention (Policy 2, 2026-04-30):
        kg of contained Li metal, not kg of LiOH·H2O / Li2CO3 compound. This matches
        industry recovery-rate reporting conventions ("Li recovery 85%" means 85% of
        contained Li, not 85% of compound salt). Conversion to compound for downstream
        re-feed: × 6.05 (1/0.16541) for LiOH·H2O eq, or × 5.32 for Li2CO3 eq.
      Hydromet route dominant for NMC811 EoL: shred -> black mass -> H2SO4 leach ->
        SX/IX -> NiSO4/CoSO4/MnSO4 + Li2SO4 -> Li2CO3 or LiOH precipitation.
      Pyrometallurgy (Umicore, Glencore) loses Li to slag/dust → only ~50% Li recovery;
        not the dominant route for new NMC plants but historically common.
      EU Battery Regulation 2023 mandates 80% Li recovery by 2031, 95% Ni/Co/Cu/Li by 2031
        (with intermediate 50% Li by 2027). Industry investments converging toward hydromet.
      Recycled Li offsets primary Li demand at chem_processing node.
